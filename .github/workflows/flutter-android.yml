name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        working-directory: mobile
        run: flutter create . --platforms=android --org com.nzr --project-name nzr_notify

      - name: Liberar internet no APK
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          s = s.replace('android:label="nzr_notify"', 'android:label="NZR Notify"')
          p.write_text(s)
          PY

      - name: Baixar dependências
        working-directory: mobile
        run: flutter pub get

      - name: Analisar projeto
        working-directory: mobile
        run: flutter analyze

      - name: Compilar APK release
        working-directory: mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NZR-Notify-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
