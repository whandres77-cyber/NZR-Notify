name: Bootstrap NZR Notify
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar projeto
        run: |
          rm -rf /tmp/nzr-notify
          mkdir -p /tmp/nzr-notify
          unzip -o .bootstrap/NZR_Notify_Premium_Source.zip -d /tmp/nzr-notify
          rsync -a --exclude='.git' --exclude='.github' /tmp/nzr-notify/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md backend docker-compose.yml docs mobile
          git commit -m "Importa NZR Notify V1 Premium" || exit 0
          git push
