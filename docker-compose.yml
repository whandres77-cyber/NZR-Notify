services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nzr_notify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nzr_notify
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  pgdata:
